<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zasedací pořádek</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300,0,0">
</head>
<body>

  <!-- ===== LOGIN SCREEN ===== -->
  <div id="login-screen">
    <div id="login-box">
      <h1>Zasedací pořádek</h1>
      <p id="login-subtitle">Václav &amp; Nikola · 13. 6. 2026</p>
      <div id="login-form">
        <input type="password" id="login-password" placeholder="Heslo" autocomplete="current-password">
        <button id="login-btn">Vstoupit</button>
        <p id="login-error" hidden>Špatné heslo. Zkuste to znovu.</p>
      </div>
    </div>
  </div>

  <!-- ===== SIDEBAR ===== -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>Zasedací pořádek</h1>
      <p id="wedding-meta"></p>
    </div>

    <div id="filters">
      <input id="filter-search" type="text" placeholder="Hledat hosta...">
      <div id="filter-row">
        <select id="filter-side">
          <option value="all">Všechny strany</option>
          <option value="bride">Nevěsta</option>
          <option value="groom">Ženich</option>
          <option value="mutual">Společní</option>
        </select>
        <select id="filter-diet">
          <option value="all">Všechny diety</option>
          <option value="vegetarian">Vegetarián</option>
          <option value="abstinent">Abstinent</option>
          <option value="child">Dítě</option>
        </select>
        <select id="filter-rsvp">
          <option value="all">Vše RSVP</option>
          <option value="confirmed">Potvrzeno</option>
          <option value="pending">Čeká</option>
          <option value="declined">Odmítnuto</option>
        </select>
        <input id="filter-group" type="text" placeholder="Skupina...">
      </div>
    </div>

    <div id="unassigned-area" class="drop-zone">
      <div id="unassigned-header">
        <h2>Nepřiřazení (<span id="unassigned-count">0</span>)</h2>
      </div>
      <ul id="guest-list"></ul>
    </div>

    <button id="btn-add-guest">+ Přidat hosta</button>
  </aside>

  <!-- ===== MAIN ===== -->
  <main id="floor-plan">

    <header id="top-bar">
      <div id="stats-bar"></div>
      <div id="action-buttons">
        <button id="btn-export">Export</button>
        <button id="btn-import">Import</button>
        <input type="file" id="file-input" accept=".json" style="display:none">
        <button id="btn-print">Tisk</button>
      </div>
    </header>

    <div id="venue-scroll">
      <div id="venue">

        <!-- HEAD TABLE (top of U) -->
        <div id="head-section">
          <div id="head-table">
            <div id="head-row"></div>
          </div>
        </div>

        <!-- WINGS (legs of U) -->
        <div id="wings-wrapper">
          <div id="left-wing" class="wing">
            <div class="wing-tables">
              <div class="seat-column" id="left-outer"></div>
              <div class="seat-column" id="left-inner"></div>
            </div>
          </div>

          <div id="right-wing" class="wing">
            <div class="wing-tables">
              <div class="seat-column" id="right-inner"></div>
              <div class="seat-column" id="right-outer"></div>
            </div>
          </div>
        </div>

      </div>

      <!-- Print-only legend -->
      <div id="print-legend">
        <h3>Legenda</h3>
        <div class="legend-items">
          <span>🧑 teenager &nbsp; 👦 dítě &nbsp; 👶 batole &nbsp; 🍼 miminko</span>
        </div>
      </div>
    </div>

  </main>

  <!-- ===== MODAL: Přidat/upravit hosta ===== -->
  <div id="modal-guest" class="modal" hidden>
    <div class="modal-box">
      <h2 id="modal-guest-title">Přidat hosta</h2>
      <form id="form-guest" autocomplete="off">
        <div class="form-row">
          <div class="form-group">
            <label>Jméno *</label>
            <input name="firstName" placeholder="Jméno" required>
          </div>
          <div class="form-group">
            <label>Příjmení *</label>
            <input name="lastName" placeholder="Příjmení" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Dieta</label>
            <select name="diet">
              <option value="standard">Standardní</option>
              <option value="vegetarian">Vegetarián</option>
              <option value="abstinent">Abstinent</option>
              <option value="child">Dítě</option>
            </select>
          </div>
          <div class="form-group">
            <label>Strana</label>
            <select name="side">
              <option value="bride">Nevěsta</option>
              <option value="groom">Ženich</option>
              <option value="mutual">Společný</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Skupina / rodina</label>
            <input name="group" placeholder="např. Novákovi, spolupráce...">
          </div>
          <div class="form-group">
            <label>Vztah</label>
            <input name="relationship" placeholder="např. bratranec, kamarád...">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>RSVP</label>
            <select name="rsvp">
              <option value="confirmed">Potvrzeno</option>
              <option value="pending">Čeká</option>
              <option value="declined">Odmítnuto</option>
            </select>
          </div>
          <div class="form-group">
            <label>Poznámky</label>
            <input name="notes" placeholder="Jakékoliv poznámky...">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="btn-delete-guest" class="btn-danger" hidden>Smazat hosta</button>
          <button type="button" id="btn-cancel-guest" class="btn-secondary">Zrušit</button>
          <button type="submit" class="btn-primary">Uložit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== MODAL: Potvrdit ===== -->
  <div id="modal-confirm" class="modal" hidden>
    <div class="modal-box modal-box-sm">
      <p id="confirm-text"></p>
      <div class="modal-actions" style="justify-content:center">
        <button id="confirm-cancel" class="btn-secondary">Zrušit</button>
        <button id="confirm-ok" class="btn-primary">Potvrdit</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
